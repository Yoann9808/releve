name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verifier:
    name: Tests, types et build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer
        run: npm install --no-audit --no-fund
      - name: Tests (logique métier et vocabulaire)
        run: npm test
      - name: Types
        run: npm run typecheck
      - name: Build Next.js
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
